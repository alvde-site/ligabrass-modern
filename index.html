    <title>Лига Брасс</title>

    <!-- ИСПРАВЛЕННЫЙ СКРИПТ-ПЕРЕХВАТЧИК РОУТИНГА ДЛЯ GITHUB PAGES -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>

    <!-- Яндекс Метрика (Инициализация глобальной функции ym) -->
    <script type="text/javascript">
      (function (m, e, t, r, i, k, a) {
        m[i] =
          m[i] ||
          function () {
            (m[i].a = m[i].a || []).push(arguments);
          };
        m[i].l = 1 * new Date();
        for (var j = 0; j < e.length; j++) {
          if (e[j].src === r) {
            return;
          }
        }
        ((k = e.createElement(t)),
          (a = e.getElementsByTagName(t)),
          (k.async = 1),
          (k.src = r),
          a.parentNode.insertBefore(k, a));
      })(window, document, "script", "https://yandex.ru", "ym");

      ym(113839839, "init", {
        clickmap: true,
        trackLinks: true,
        accurateTrackBounce: true,
        webvisor: true,
        defer: true /* Отключает автоматический первый хит, отдавая управление React-роутеру */,
      });
    </script>
