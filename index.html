<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Основные метатеги поисковой оптимизации (SEO) -->
    <meta
      name="title"
      content="Лига Брасс — Ансамбль медных духовых инструментов"
    />
    <meta
      name="description"
      content="Официальный site творческого коллектива Лига Брасс. Ансамбль солистов, представляющий классический состав медных духовых инструментов и академический музыкальный репертуар."
    />
    <meta
      name="keywords"
      content="лига брасс, брасс квинтет, медные духовые инструменты, ансамбль солистов, духовой квинтет, академическая музыка, концертные программы, труба, тромбон, валторна, туба, живая музыка на концерт"
    />
    <meta name="author" content="Лига Брасс" />
    <meta name="application-name" content="Лига Брасс" />

    <!-- Глобальная разметка Open Graph (OG) для превью ссылок в Telegram и VK -->
    <meta
      name="og:title"
      content="Лига Брасс — Ансамбль медных духовых инструментов"
    />
    <meta name="og:type" content="website" />
    <meta
      name="og:description"
      content="Официальный сайт творческого коллектива. Хроника событий, архив концертов, репертуарные программы и медиагалерея."
    />
    <meta property="og:image" content="icons/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Лига Брасс" />

    <!-- Современный пакет иконок для всех устройств (относительные пути из папки public/icons/) -->
    <link
      rel="icon"
      type="image/png"
      href="icons/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
    <link rel="shortcut icon" href="icons/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="icons/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Лига Брасс" />

    <!-- Веб-манифест PWA-приложения -->
    <link rel="manifest" href="icons/site.webmanifest" />
    <meta name="msapplication-TileColor" content="#121212" />

    <!-- Тонирование строки мобильного браузера в цвет нашей матовой антрацитовой темы -->
    <meta name="theme-color" content="#121212" />

    <title>Лига Брасс</title>

    <!-- Скрипт-перехватчик хака роутинга для GitHub Pages -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <noscript>Для работы этого приложения необходимо включить JavaScript.</noscript>
    <div id="root"></div>
    
    <!-- Главная точка входа скрипта Vite (путь сделан относительным) -->
    <script type="module" src="src/main.tsx"></script>
  </body>
</html>
